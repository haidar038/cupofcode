name: CI (quality gate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  check-and-build:
    name: Astro check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bunx astro check

      - name: Build
        run: bun run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://cupofcode.cc' }}

      # Deploy ditangani Vercel otomatis dari push ke main.
      # (Job SCP+PM2 lama dihapus — ecosystem.config.cjs sudah tidak ada.)
